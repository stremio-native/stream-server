name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    env:
      LIBTORRENT_STATIC: "1"
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install cargo-chef
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-chef
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl pkg-config libssl-dev libfuse2 libboost-dev libclang-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Install libtorrent 2.1.1
        run: bash .github/scripts/install-libtorrent.sh
      - name: Cargo Chef Prepare
        run: cargo chef prepare --recipe-path recipe.json
      - name: Cargo Chef Cache
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-clippy-cargo-chef-${{ hashFiles('recipe.json') }}
          restore-keys: |
            ${{ runner.os }}-clippy-cargo-chef-
      - name: Cargo Chef Cook
        run: cargo chef cook --recipe-path recipe.json --features libtorrent --no-default-features
      - name: Restore Source Code
        run: git restore server enginefs bindings stremio-runtime-stub updater-helper settings-gui
      - name: Run Clippy
        run: cargo clippy --workspace --features libtorrent --no-default-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    env:
      LIBTORRENT_STATIC: "1"
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-chef
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-chef
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl pkg-config libssl-dev libfuse2 libboost-dev libclang-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Install libtorrent 2.1.1
        run: bash .github/scripts/install-libtorrent.sh
      - name: Cargo Chef Prepare
        run: cargo chef prepare --recipe-path recipe.json
      - name: Cargo Chef Cache
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-test-cargo-chef-${{ hashFiles('recipe.json') }}
          restore-keys: |
            ${{ runner.os }}-test-cargo-chef-
      - name: Cargo Chef Cook
        run: cargo chef cook --recipe-path recipe.json --features libtorrent --no-default-features
      - name: Restore Source Code
        run: git restore server enginefs bindings stremio-runtime-stub updater-helper settings-gui
      - name: Run Tests
        run: cargo test --workspace --features libtorrent --no-default-features

  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit
