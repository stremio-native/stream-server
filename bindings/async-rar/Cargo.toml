[package]
name = "async-rar"
version = "0.1.8"
edition = "2024"
description = "Async Rust bindings for UnRAR"
license = "MIT"
repository = "https://github.com/user/async-rar"
keywords = ["rar", "unrar", "archive", "async", "ffi"]
categories = ["compression", "asynchronous"]

[[test]]
name = "build-support"
path = "build_support.rs"

[dependencies]
autocxx = "0.30"
cxx = "1.0.199"
tokio = { version = "1.53.1", features = ["rt", "sync"] }
thiserror = "2.0.20"

[build-dependencies]
autocxx-build = "0.30"
cc = "1.4.4"
glob = "0.3.4"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tempfile = "3.27.0"
