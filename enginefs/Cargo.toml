[package]
name = "enginefs"
version = "0.1.8"
edition = "2024"

[dependencies]
librqbit = { version = "9.0.1", optional = true }
libtorrent-sys = { path = "../bindings/libtorrent-sys", optional = true }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "sync",
    "process",
    "test-util",
] }
tokio-util = { version = "0.7.19", features = ["rt"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bencode = "0.2.4"
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
async-trait = "0.1.92"
bytes = "1.12.1"
futures = "0.3.34"
url = "2.5.8"
hex = "0.4.3"
regex = "1.13.1"
anyhow = "1.0.104"
moka = { version = "0.12.16", features = ["future", "sync"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
urlencoding = "2.1.3"
bumpalo = { version = "3.20.3", features = ["collections"] }
memmap2 = "0.9.11"
parking_lot = "0.12.5"

[features]
default = ["libtorrent"]
librqbit = ["dep:librqbit"]
libtorrent = ["dep:libtorrent-sys"]
