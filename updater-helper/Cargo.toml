[package]
name = "updater-helper"
version = "0.1.8"
edition = "2024"

[[bin]]
name = "stream-server-updater"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.39.6"

[build-dependencies]
winres = "0.1.12"
